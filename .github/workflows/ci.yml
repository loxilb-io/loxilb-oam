name: CI

# Blocking PR gate: build, vet, unit tests, and golangci-lint.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Check formatting
        # gofmt -l lists files that are not properly formatted; any output fails.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # Integration suites under tests/rest_api and tests/e2e need a live
        # server + database and are excluded from CI. -race needs atomic mode.
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out \
            $(go list ./... | grep -v '/tests/rest_api' | grep -v '/tests/e2e')

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage floor
        # Blocking ratchet: fail if total statement coverage drops below the
        # floor. Raise the second arg as tests land (see coverage-gate.sh).
        # CI's covdata merge folds test-less packages into the denominator, so
        # this total runs a few points below a per-package view — the floor is
        # calibrated to it.
        run: bash .github/scripts/coverage-gate.sh coverage.out 18

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Boots the real binary against a MySQL service and runs the env-driven
    # tests/rest_api suite — this is what protects the HTTP API contract.
    services:
      mysql:
        image: mysql:9.2.0  # pinned to match deploy/compose/docker-compose.yml
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: loxioam
          MYSQL_USER: oamuser
          MYSQL_PASSWORD: oampass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Load database schema
        # Run the client inside the service container (unix socket) so MySQL 9's
        # caching_sha2 auth needs no TLS / public-key exchange over TCP.
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -uroot -proot loxioam < database/init/00-init-complete.sql

      - name: Build server
        run: go build -o oam-server .

      - name: Boot server
        env:
          OAM_JWT_SECRET: ci-integration-jwt-secret
          OAM_DEFAULT_ADMIN_PASSWORD: ChangeMe-Admin1!
          OAM_DB_PASSWORD: oampass
        run: |
          ./oam-server -db-host 127.0.0.1 -db-port 3306 -db-user oamuser \
            -db-name loxioam -port 8080 > server.log 2>&1 &
          echo $! > server.pid
          # Wait until /oam/health responds (server + DB ready).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/oam/health || true)
            if [ "$code" != "000" ]; then echo "server ready (HTTP $code)"; break; fi
            sleep 1
          done

      - name: Run integration tests
        # OAM_TEST_ADMIN_PASSWORD must match OAM_DEFAULT_ADMIN_PASSWORD above so
        # the suite can log in as the bootstrap admin. Firmware tests self-skip
        # (no reachable LoxiLB instance) unless OAM_TEST_LIVE_INSTANCE is set.
        env:
          OAM_TEST_PASSWORD: ChangeMe-Test1!
          OAM_TEST_ADMIN_PASSWORD: ChangeMe-Admin1!
        run: go test -count=1 -v ./tests/rest_api/...

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  swagger-drift:
    name: Swagger drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Backward-compat guard: the generated OpenAPI docs must stay in sync with
    # the handler annotations. Regenerate and fail if anything changed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Regenerate Swagger docs
        # swag version is pinned to match the one in go.mod so output is
        # deterministic. Default args match how docs/ was generated:
        # --generalInfo main.go --dir ./ --output ./docs.
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init

      - name: Check for drift
        run: git diff --exit-code docs/docs.go docs/swagger.json docs/swagger.yaml

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true
      # Install a pinned golangci-lint v2 via `go install` so the linter is
      # built with the same Go toolchain as the module. This avoids the
      # linter-vs-toolchain version skew that makes `typecheck` fail on
      # standard-library method sets (e.g. gin's ResponseWriter).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m ./...

  # Note: the Go vulnerability scan lives in its own workflow (govulncheck.yml)
  # as a reachable+fixable gate, replacing the former advisory job here.
