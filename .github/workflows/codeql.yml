name: CodeQL

# Static analysis of the Go code. Advisory at launch (not a required status
# check); findings land in the repository's Security tab. This module is pure
# Go with no cgo or submodules, so CodeQL's autobuild drives the build.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 2'  # weekly, Tuesday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'
