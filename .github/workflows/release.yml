name: Release

# Tag-triggered release. Versions follow loxilb-io/loxilb — vMAJOR.MINOR.PATCH
# with an optional build component (v0.9.8.7), or a -rc./-alpha./-beta. suffix
# for a prerelease; the tag is validated below and stamped into the binary.
# Produces:
#   - a linux/amd64 binary tarball + SHA256SUMS attached to a GitHub Release
#   - a container image pushed to GHCR (ghcr.io/<owner>/loxilb-oam), which is
#     Cosign-signed (keyless/OIDC), carries a SLSA build-provenance attestation,
#     and an SPDX SBOM attestation.
# A Trivy CRITICAL+fixable scan gates the image BEFORE it is pushed/published.
# `-rc.` / `-alpha.` / `-beta.` tags publish as prereleases and do NOT move
# the `:latest` image tag.
#
# AUTHORIZATION: this job targets the `release` Environment, which carries
# required reviewers (self-review blocked, no admin bypass) and a deployment
# branch policy allowing only `v*` tags. A tag alone cannot ship a release, and
# a run started from a branch cannot deploy at all.
#
# NOTE: pushing to GHCR requires the org to grant this repo `packages: write`.
on:
  push:
    tags: ['v*']
  # Rebuild the image for an EXISTING tag. Run it with the tag as the ref
  # ("gh workflow run release.yml --ref v0.9.8.7"), not from a branch: the
  # version comes from the ref, so there is no free-text input that could name
  # one tag while the job builds another. This path republishes the image only —
  # the GitHub Release is created on tag push alone (see the step's `if`).
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs publish concurrently — they would race on `:latest` and on
# the release page. Queue instead of cancelling: a half-published release is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated deployment target: publishing requires an approval from a
    # required reviewer configured on the `release` environment.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
      id-token: write # keyless Cosign signing + attestation OIDC
      attestations: write # record build-provenance / SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: ver
        run: |
          # The ref IS the version, for both triggers. checkout above therefore
          # built exactly the tagged tree — a dispatch cannot build one commit
          # while labelling it as another.
          if [ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::Release must run on a tag ref, got '${GITHUB_REF}'. Re-run with: gh workflow run release.yml --ref <tag>"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME}"
          # loxilb-oam follows loxilb-io/loxilb's scheme: vMAJOR.MINOR.PATCH
          # with an optional fourth build component (e.g. v0.9.8.7), plus an
          # optional -rc/-alpha/-beta prerelease suffix. Reject anything else
          # so a stray tag cannot publish a release.
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-(rc|alpha|beta)[.-]?[0-9]+)?$'; then
            echo "::error::'${VERSION}' is not a valid version: expected vMAJOR.MINOR.PATCH[.BUILD][-rc.N] (e.g. v0.9.8.7)"
            exit 1
          fi
          # The Makefile's VERSION is what a local `make build` stamps and what
          # the docs quote, so it drifting behind the tag is worth surfacing.
          #
          # Deliberately a warning, not a hard failure. The tag is the only
          # input to the published artifact (see the -ldflags stamp below), so
          # drift cannot corrupt a release — while failing here would burn the
          # tag: release tags are immutable by ruleset, and versions are in
          # lockstep with loxilb, so the number cannot simply be bumped to get
          # unstuck. Surface it and let the release proceed.
          MK_VERSION="$(make -s version 2>/dev/null || true)"
          if [ -n "$MK_VERSION" ] && [ "$MK_VERSION" != "$VERSION" ]; then
            echo "::warning::tag '${VERSION}' disagrees with the Makefile's VERSION (${MK_VERSION}). The release is stamped '${VERSION}' and is correct, but local 'make build' will report '${MK_VERSION}' until the Makefile is bumped."
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Prerelease when the tag carries an -rc/-alpha/-beta suffix.
          if echo "$VERSION" | grep -Eq -- '-(rc|alpha|beta)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          VERSION="${{ steps.ver.outputs.version }}"
          TAGS="${IMAGE}:${VERSION}"
          # Only a final (non-prerelease) tag moves :latest.
          if [ "${{ steps.ver.outputs.prerelease }}" = "false" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'list<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Build binaries (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init
          # Stamp the tag into main.version — it is what `loxilb-oam -version`,
          # the startup log, and the served OpenAPI spec report.
          go build -ldflags "-X main.version=${{ steps.ver.outputs.version }}" -o loxilb-oam .
          go build -o reset_admin ./cmd/reset_admin

      - name: Package tarball + checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="loxilb-oam_${VERSION}_linux_amd64"
          mkdir -p "dist/${DIST}"
          cp loxilb-oam reset_admin LICENSE README.md "dist/${DIST}/"
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          ( cd dist && sha256sum "${DIST}.tar.gz" > SHA256SUMS )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load for scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          build-args: VERSION=${{ steps.ver.outputs.version }}

      - name: Trivy gate (CRITICAL + fixable) — blocks publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.ver.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          # Auth forces syft's `registry:` source so it pulls the pushed digest
          # straight from GHCR over HTTPS. Without it syft auto-detects and falls
          # through docker daemon -> containerd (socket is non-root-inaccessible
          # on GHA runners), which hard-fails the scan.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          # When a Release already exists for the tag — any re-run, or a
          # dispatch rebuild — this action otherwise tries to attach the SBOM to
          # it by re-downloading its own workflow artifact, which needs
          # `actions: read` that this job deliberately does not grant, and the
          # step dies with "Resource not accessible by integration". The SBOM is
          # attached by the release step below and attested above, so the
          # action's own upload is redundant.
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Only a tag push publishes a release page. A dispatch rebuild
      # republishes the image and re-attests it, but must never create or
      # rewrite a release — and, because this action creates a missing tag at
      # the ref it runs on, gating it here also removes the last way a run could
      # mint a tag that no one pushed. To finish a release that failed at this
      # step, re-run the original tag-push run.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            sbom.spdx.json
