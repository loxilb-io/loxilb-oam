name: Release

# Tag-triggered release. Versions follow loxilb-io/loxilb — vMAJOR.MINOR.PATCH
# with an optional build component (v0.9.8.7), or a -rc./-alpha./-beta. suffix
# for a prerelease; the tag is validated below and stamped into the binary.
# Produces:
#   - a linux/amd64 binary tarball + SHA256SUMS attached to a GitHub Release
#   - a container image pushed to GHCR (ghcr.io/<owner>/loxilb-oam), which is
#     Cosign-signed (keyless/OIDC), carries a SLSA build-provenance attestation,
#     and an SPDX SBOM attestation.
# A Trivy CRITICAL+fixable scan gates the image BEFORE it is pushed/published.
# `-rc.` / `-alpha.` / `-beta.` tags publish as prereleases and do NOT move
# the `:latest` image tag.
#
# AUTHORIZATION: this job targets the `release` Environment, so publishing
# waits for a required-reviewer approval even after a tag is pushed — a tag
# alone cannot ship a release.
#
# NOTE: pushing to GHCR requires the org to grant this repo `packages: write`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.9.8.7 or v0.9.8.7-rc.1)'
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated deployment target: publishing requires an approval from a
    # required reviewer configured on the `release` environment.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
      id-token: write # keyless Cosign signing + attestation OIDC
      attestations: write # record build-provenance / SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          # loxilb-oam follows loxilb-io/loxilb's scheme: vMAJOR.MINOR.PATCH
          # with an optional fourth build component (e.g. v0.9.8.7), plus an
          # optional -rc/-alpha/-beta prerelease suffix. Reject anything else
          # so a stray tag cannot publish a release.
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-(rc|alpha|beta)[.-]?[0-9]+)?$'; then
            echo "::error::'${VERSION}' is not a valid version: expected vMAJOR.MINOR.PATCH[.BUILD][-rc.N] (e.g. v0.9.8.7)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Prerelease when the tag carries an -rc/-alpha/-beta suffix.
          if echo "$VERSION" | grep -Eq -- '-(rc|alpha|beta)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          VERSION="${{ steps.ver.outputs.version }}"
          TAGS="${IMAGE}:${VERSION}"
          # Only a final (non-prerelease) tag moves :latest.
          if [ "${{ steps.ver.outputs.prerelease }}" = "false" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'list<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true

      - name: Build binaries (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init
          # Stamp the tag into main.version — it is what `loxilb-oam -version`,
          # the startup log, and the served OpenAPI spec report.
          go build -ldflags "-X main.version=${{ steps.ver.outputs.version }}" -o loxilb-oam .
          go build -o reset_admin ./cmd/reset_admin

      - name: Package tarball + checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="loxilb-oam_${VERSION}_linux_amd64"
          mkdir -p "dist/${DIST}"
          cp loxilb-oam reset_admin LICENSE README.md "dist/${DIST}/"
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          ( cd dist && sha256sum "${DIST}.tar.gz" > SHA256SUMS )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load for scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          build-args: VERSION=${{ steps.ver.outputs.version }}

      - name: Trivy gate (CRITICAL + fixable) — blocks publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.ver.outputs.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          # Auth forces syft's `registry:` source so it pulls the pushed digest
          # straight from GHCR over HTTPS. Without it syft auto-detects and falls
          # through docker daemon -> containerd (socket is non-root-inaccessible
          # on GHA runners), which hard-fails the scan.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            sbom.spdx.json
