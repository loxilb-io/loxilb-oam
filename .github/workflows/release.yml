name: Release

# Tag-triggered release (push a tag like v1.2.3, or v1.2.3-rc.1 for a
# prerelease). Produces:
#   - a linux/amd64 binary tarball + SHA256SUMS attached to a GitHub Release
#   - a container image pushed to GHCR (ghcr.io/<owner>/loxilb-oam)
# A Trivy CRITICAL+fixable scan gates the image BEFORE it is pushed/published.
# `-rc.` / `-alpha.` / `-beta.` tags publish as prereleases and do NOT move
# the `:latest` image tag.
#
# NOTE: pushing to GHCR requires the org to grant this repo `packages: write`
# (Settings → Actions → Workflow permissions, or org package settings). Until
# then the build/scan/tarball/release steps still run; only the push needs it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v1.2.3 or v1.2.3-rc.1)'
        required: true

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Prerelease when the tag carries an -rc./-alpha./-beta. suffix.
          if echo "$VERSION" | grep -Eq -- '-(rc|alpha|beta)\.'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          VERSION="${{ steps.ver.outputs.version }}"
          TAGS="${IMAGE}:${VERSION}"
          # Only a final (non-prerelease) tag moves :latest.
          if [ "${{ steps.ver.outputs.prerelease }}" = "false" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'list<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Build binaries (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init
          go build -o loxilb-oam .
          go build -o reset_admin ./cmd/reset_admin

      - name: Package tarball + checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DIST="loxilb-oam_${VERSION}_linux_amd64"
          mkdir -p "dist/${DIST}"
          cp loxilb-oam reset_admin LICENSE README.md "dist/${DIST}/"
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          ( cd dist && sha256sum "${DIST}.tar.gz" > SHA256SUMS )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}

      - name: Trivy gate (CRITICAL + fixable) — blocks publish
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
