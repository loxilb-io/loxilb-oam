name: Build Image

# Blocking PR gate: proves the container image actually builds (not just
# `go build`). The Trivy scan here is ADVISORY (report-only) — the blocking
# CRITICAL+fixable gate runs in release.yml before an image is published.
# No registry push happens here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: loxilb-oam:ci

      - name: Scan image with Trivy (advisory)
        # Report HIGH+CRITICAL with a fix available. Advisory: never blocks the
        # PR — surfacing is the point. The hard gate is in release.yml.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loxilb-oam:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true
