      summary: Update snapshot metadata
      tags:
      - snapshots
  /oam/snapshots/{sid}/download:
    get:
      description: Streams the decrypted, decompressed snapshot JSON. The document
        contains IPsec PSKs and certificate private keys, so this is write-gated and
        audit-logged. X-Snapshot-Checksum carries the gateway's document checksum;
        X-Content-Checksum is sha256 over the exact bytes served.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Snapshot ID (UUID)
        in: path
        name: sid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: snapshot document JSON
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Stored blob failed integrity verification
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a snapshot document
      tags:
      - snapshots
  /oam/snapshots/{sid}/restore:
    post:
      consumes:
      - application/json
      description: 'Default mode is dry-run: the gateway validates and returns its
        plan without mutating anything. Commit first takes an automatic pre_restore
        safety snapshot of the target, then applies. The gateway''s response is returned
        verbatim in gateway_response. Cross-instance restore is allowed and flagged
        with cross_instance=true.'
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Snapshot ID (UUID)
        in: path
        name: sid
        required: true
        type: string
      - description: 'mode: dry-run (default) | commit; optional target_instance_id'
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.RestoreSnapshotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RestoreOutcome'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Stored blob failed integrity verification (never sent to the
            gateway)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "502":
          description: Gateway unreachable (connection error passed through verbatim)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore a stored snapshot to a gateway
      tags:
      - snapshots
