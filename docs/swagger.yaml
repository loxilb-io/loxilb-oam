      tags:
      - appliance
  /oam/v1/appliance/operations:
    get:
      description: Newest first. `items` is always an array. Pass `next_cursor` back
        as `cursor` for the next page.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Page size, 1-100 (default 20)
        in: query
        name: limit
        type: integer
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: Only operations in this state
        in: query
        name: state
        type: string
      - description: Only operations of this type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appliance.OperationList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: List Appliance operations (alpha)
      tags:
      - appliance
    post:
      consumes:
      - application/json
      description: Validates the request with the host adapter and records the plan.
        Nothing is executed. Repeating the request with the same Idempotency-Key returns
        the same operation (200); the same key with a different request is a conflict
        (409). The caller's role must hold the capability for the operation type.
        A plan expires 15 minutes after it is made. Contract appliance-ops/v1alpha1
        — subject to change.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 16-128 printable ASCII characters, unique per intended operation
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: What to plan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appliance.PlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The operation this key already created
          schema:
            $ref: '#/definitions/appliance.Operation'
        "201":
          description: Planned
          schema:
            $ref: '#/definitions/appliance.Operation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "422":
          description: The host adapter rejected the request
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "501":
          description: No host adapter in this deployment
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "502":
          description: The host adapter did not answer
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Plan an Appliance operation (alpha)
      tags:
      - appliance
  /oam/v1/appliance/operations/{operation_id}:
    get:
      description: Returns one operation. The plan — what it would touch and the artifacts
        involved — is included only for callers whose role may run that operation
        type; for others `redacted` is true.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Operation ID
        in: path
        name: operation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appliance.Operation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Read an Appliance operation (alpha)
      tags:
      - appliance
  /oam/v1/appliance/operations/{operation_id}/authorize:
    post:
      consumes:
      - application/json
      description: Verifies the caller's current password and returns a one-use challenge
        for submitting this operation. The challenge is bound to the operation, its
        plan, the installation, the caller and the caller's session; it expires after
        5 minutes or with the plan, whichever is sooner, and authorizing again replaces
        it. The operation moves to AWAITING_AUTHORIZATION and occupies the installation
        until it is submitted, cancelled or expires. Failed passwords count toward
        the same lockout as failed logins. Operations that do not require reauthentication
        (backup) are refused with AUTHORIZATION_NOT_REQUIRED.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Operation ID
        in: path
        name: operation_id
        required: true
        type: string
      - description: The caller's current password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appliance.AuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appliance.Challenge'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "401":
          description: 'REAUTHENTICATION_FAILED: wrong password'
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: PERMISSION_DENIED, or REAUTHENTICATION_REQUIRED for a session
            that predates session identifiers
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "409":
          description: OPERATION_CONFLICT, OPERATION_STATE_INVALID or AUTHORIZATION_NOT_REQUIRED
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "410":
          description: PLAN_EXPIRED
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "429":
          description: TOO_MANY_ATTEMPTS
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Authorize a destructive Appliance operation (alpha)
      tags:
      - appliance
  /oam/v1/appliance/operations/{operation_id}/cancel:
    post:
      description: 'Before submission cancelling always succeeds. After, the host
        adapter decides: it refuses once the operation has passed its irreversible
        phase (`cancellable` false). Cancelling a cancelled operation returns it unchanged.'
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Operation ID
        in: path
        name: operation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/appliance.Operation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "409":
          description: OPERATION_NOT_CANCELLABLE or OPERATION_STATE_INVALID
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "502":
          description: The host adapter did not answer
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Cancel an Appliance operation (alpha)
      tags:
      - appliance
  /oam/v1/appliance/operations/{operation_id}/reconcile:
    post:
      description: OAM follows submitted operations on its own; this asks it to read
        the host adapter's journal for one operation now and returns the result. It
        never causes anything to be executed twice. If the adapter does not answer,
        the operation is returned as last known with `stale` true.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Operation ID
        in: path
        name: operation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appliance.Operation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Re-read an Appliance operation from the host adapter (alpha)
      tags:
      - appliance
  /oam/v1/appliance/operations/{operation_id}/submit:
    post:
      consumes:
      - application/json
      description: Hands a planned operation to the host adapter. `plan_hash` must
        be the plan the caller reviewed. An operation that requires reauthentication
        must have been authorized and must present its challenge, which is consumed.
        Only one operation can be active per installation. The answer is 202 with
        the operation as it stands; follow it with GET. Submitting an operation that
        was already submitted returns it unchanged. If the host adapter could not
        be reached the operation stays QUEUED with `stale` true and OAM delivers it
        when the adapter answers; it is never executed twice.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Operation ID
        in: path
        name: operation_id
        required: true
        type: string
      - description: The plan being submitted and, when required, its challenge
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appliance.SubmitRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/appliance.Operation'
        "400":
          description: INVALID_REQUEST or CHALLENGE_REQUIRED
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: PERMISSION_DENIED, CHALLENGE_MISMATCH or REAUTHENTICATION_REQUIRED
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "409":
          description: OPERATION_CONFLICT, OPERATION_STATE_INVALID, PLAN_STALE or
            CHALLENGE_CONSUMED
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "410":
          description: PLAN_EXPIRED or CHALLENGE_EXPIRED
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Submit an Appliance operation for execution (alpha)
      tags:
      - appliance
  /oam/v1/appliance/status:
    get:
      description: Product identity (from the host adapter, when there is one), each
        component's version with separately observed liveness and readiness, and OAM's
        database schema version. A component that could not be observed is "unknown"
        and stale, never ready. Contract appliance-ops/v1alpha1 — subject to change.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appliance.Status'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/appliance.ErrorBody'
      security:
      - BearerAuth: []
      summary: Appliance status (alpha)
      tags:
      - appliance
securityDefinitions:
  BearerAuth:
    description: JWT bearer token from POST /oam/login, sent as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
