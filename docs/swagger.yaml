definitions:
  appliance.Action:
    enum:
    - backup
    - restore
    - update
    - rollback
    - reset
    - diagnostics
    type: string
    x-enum-varnames:
    - ActionBackup
    - ActionRestore
    - ActionUpdate
    - ActionRollback
    - ActionReset
    - ActionDiagnostics
  appliance.ActionCapability:
    properties:
      action:
        $ref: '#/definitions/appliance.Action'
      available:
        description: 'Available: it can be executed now.'
        type: boolean
      permitted:
        description: 'Permitted: the caller''s role may request it. Independent of
          the above.'
        type: boolean
      requires_reauthentication:
        description: 'RequiresReauthentication: executing it needs a fresh password
          check.'
        type: boolean
      supported:
        description: |-
          Supported: the host adapter implements the action in a contract
          version OAM speaks.
        type: boolean
      unavailable_reason:
        allOf:
        - $ref: '#/definitions/appliance.UnavailableReason'
        description: UnavailableReason is set exactly when Available is false.
    type: object
  appliance.AuthorizeRequest:
    properties:
      password:
        description: |-
          Password is the caller's current password. It is verified and
          discarded; it is never stored or logged.
        type: string
    type: object
  appliance.Capabilities:
    properties:
      actions:
        items:
          $ref: '#/definitions/appliance.ActionCapability'
        type: array
      host_configured:
        type: boolean
      host_contract_versions:
        items:
          type: string
        type: array
      host_fixture:
        description: |-
          HostFixture is true when the host adapter declares itself a test
          fixture. Nothing a fixture reports describes a real installation.
        type: boolean
      observed_at:
        type: string
      schema_version:
        type: string
    type: object
  appliance.Challenge:
    properties:
      challenge:
        type: string
      expires_at:
        type: string
      operation_id:
        type: string
      plan_hash:
        type: string
    type: object
  appliance.Component:
    properties:
      digest:
        type: string
      liveness:
        type: string
      name:
        type: string
      observed_at:
        type: string
      readiness:
        type: string
      stale:
        description: 'Stale: the observation could not be refreshed for this response.'
        type: boolean
      version:
        type: string
    type: object
  appliance.DatabaseStatus:
    properties:
      adopted:
        type: boolean
      applied_at:
        type: string
      latest_migration:
        type: string
      schema_version:
        description: |-
          SchemaVersion is 0 when the schema is not tracked (OAM_DB_MIGRATE=off
          on a database that was never migrated by the server).
        type: integer
    type: object
  appliance.ErrorBody:
    properties:
      code:
        type: string
      error:
        type: string
      operation_id:
        type: string
      origin:
        type: string
      recovery:
        $ref: '#/definitions/appliance.Recovery'
      request_id:
        type: string
    type: object
  appliance.Operation:
    properties:
      actor:
        type: string
      cancellable:
        description: |-
          Cancellable: a cancel request would be accepted now. Decided by OAM
          before submission and by the host adapter after.
        type: boolean
      created_at:
        type: string
      error_code:
        type: string
      error_origin:
        type: string
      finished_at:
        type: string
      host_fixture:
        description: |-
          HostFixture: the plan came from a fixture host adapter and describes
          nothing real.
        type: boolean
      host_generation:
        description: |-
          HostGeneration is the host journal generation this operation reflects;
          0 until the host has reported on it.
        type: integer
      id:
        type: string
      installation_id:
        type: string
      model:
        type: string
      note:
        type: string
      phase:
        type: string
      plan:
        $ref: '#/definitions/appliance.Plan'
      plan_expires_at:
        type: string
      plan_hash:
        description: |-
          PlanHash and Plan are present only for callers permitted to run this
          type of operation; Redacted is true when they were withheld.
        type: string
      reconciliation:
        type: string
      redacted:
        type: boolean
      request_id:
        type: string
      requires_reauthentication:
        type: boolean
      schema_version:
        type: string
      stale:
        description: |-
          Stale: the host could not be read at the last attempt, so State may be
          out of date.
        type: boolean
      state:
        $ref: '#/definitions/appliance.OperationState'
      submitted_at:
        type: string
      type:
        $ref: '#/definitions/appliance.OperationType'
      updated_at:
        type: string
    type: object
  appliance.OperationList:
    properties:
      items:
        items:
          $ref: '#/definitions/appliance.Operation'
        type: array
      next_cursor:
        description: |-
          NextCursor is passed back as `cursor` for the next page; absent on the
          last one.
        type: string
      schema_version:
        type: string
    type: object
  appliance.OperationState:
    enum:
    - PLANNED
    - AWAITING_AUTHORIZATION
    - QUEUED
    - RUNNING
    - VERIFYING
    - SUCCEEDED
    - FAILED
    - COMPENSATING
    - ROLLED_BACK
    - RECOVERY_REQUIRED
    - CANCELLED
    type: string
    x-enum-varnames:
    - StatePlanned
    - StateAwaitingAuthorization
    - StateQueued
    - StateRunning
    - StateVerifying
    - StateSucceeded
    - StateFailed
    - StateCompensating
    - StateRolledBack
    - StateRecoveryRequired
    - StateCancelled
  appliance.OperationType:
    enum:
    - backup
    - restore
    - update
    - rollback
    - reset
    type: string
    x-enum-varnames:
    - OperationBackup
    - OperationRestore
    - OperationUpdate
    - OperationRollback
    - OperationReset
  appliance.Plan:
    properties:
      affected_resources:
        items:
          type: string
        type: array
      archive_digest:
        type: string
      compatibility:
        type: string
      current_release_digest:
        type: string
      irreversible_after_phase:
        description: IrreversibleAfterPhase is the phase after which cancellation
          is refused.
        type: string
      target_release_digest:
        type: string
    type: object
  appliance.PlanRequest:
    properties:
      archive_ref:
        description: |-
          ArchiveRef names a backup archive the host has admitted. Required for
          restore, refused otherwise.
        type: string
      note:
        description: Note is free text for the audit trail.
        type: string
      schema_version:
        type: string
      target_release_ref:
        description: |-
          TargetReleaseRef names a release the host has admitted. Required for
          update, refused otherwise.
        type: string
      type:
        $ref: '#/definitions/appliance.OperationType'
    type: object
  appliance.Product:
    properties:
      fixture:
        type: boolean
      installation_id:
        type: string
      model:
        type: string
      release_digest:
        type: string
      release_version:
        type: string
    type: object
  appliance.Recovery:
    properties:
      action:
        type: string
      operation_id:
        description: OperationID names the operation to wait for, with WAIT_FOR_OPERATION.
        type: string
    type: object
  appliance.Status:
    properties:
      components:
        items:
          $ref: '#/definitions/appliance.Component'
        type: array
      database:
        $ref: '#/definitions/appliance.DatabaseStatus'
      product:
        $ref: '#/definitions/appliance.Product'
      schema_version:
        type: string
    type: object
  appliance.SubmitRequest:
    properties:
      challenge:
        description: |-
          Challenge is the value Authorize returned. Required for an operation
          that requires reauthentication, ignored otherwise.
        type: string
      plan_hash:
        description: PlanHash is the plan the caller reviewed.
        type: string
    type: object
  appliance.UnavailableReason:
    enum:
    - HOST_NOT_CONFIGURED
    - HOST_UNREACHABLE
    - HOST_UNSUPPORTED
    - SCHEMA_MISMATCH
    - OPERATION_IN_PROGRESS
    - RECOVERY_REQUIRED
    type: string
    x-enum-varnames:
    - ReasonHostNotConfigured
    - ReasonHostUnreachable
    - ReasonHostUnsupported
    - ReasonSchemaMismatch
    - ReasonOperationInProgress
    - ReasonRecoveryRequired
  models.AcknowledgeRequest:
    properties:
      user_id:
        type: integer
    required:
    - user_id
    type: object
  models.AcknowledgeResponse:
    properties:
      ack_time:
        type: string
      alert_id:
        type: integer
      status:
        type: string
    type: object
  models.AdminUpdateRequest:
    properties:
      confirmPassword:
        type: string
      currentPassword:
        type: string
      currentUsername:
        type: string
      newEmail:
        type: string
      newPassword:
        minLength: 9
        type: string
      newUsername:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - confirmPassword
    - currentPassword
    - currentUsername
    - newEmail
    - newPassword
    - newUsername
    type: object
  models.AdminUpdateResponse:
    properties:
      message:
        type: string
      newAccessToken:
        type: string
      success:
        type: boolean
    type: object
  models.Alert:
    properties:
      created_at:
        type: string
      id:
        type: integer
      instance_id:
        type: integer
      message:
        type: string
      resolved_at:
        description: Nullable if not resolved
        type: string
      severity:
        description: INFO, WARNING, CRITICAL
        type: string
      type:
        description: DB_DISCONNECT, API_UNREACHABLE, HIGH_CPU, MEMORY_LEAK.
        type: string
    type: object
  models.CreateAlertRequest:
    properties:
      instance_id:
        type: integer
      message:
        type: string
      severity:
        type: string
      type:
        type: string
    required:
    - instance_id
    - message
    - severity
    - type
    type: object
  models.CreateAlertResponse:
    properties:
      alert_id:
        type: integer
      status:
        type: string
    type: object
  models.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        description: 'Optional: Admin can set role (defaults to "user")'
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.EnhancedLoginResponse:
    properties:
      id:
        type: integer
      token:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      code:
        description: code
        type: integer
      details:
        description: details
        type: string
      fields:
        description: fields
        items:
          type: string
        type: array
      message:
        description: message
        type: string
      result:
        description: result
        type: string
      sub-code:
        description: sub code
        type: integer
    type: object
  models.HealthCheckResponse:
    properties:
      gateway_auth_mode:
        type: string
      status:
        type: string
    type: object
  models.InstanceSnapshot:
    properties:
      checksum:
        description: '"sha256:<hex>", gateway-computed (envelope)'
        type: string
      checksum_ok:
        description: integrity-sweep verdict
        type: boolean
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      encrypted:
        type: boolean
      gateway_version:
        type: string
      id:
        type: string
      instance_id:
        type: integer
      last_restore_components:
        description: |-
          LastRestoreComponents is the domain selection of the most recent
          restore attempt; absent when it restored the whole document. Like the
          response, only populated on the single-snapshot GET.
        items:
          type: string
        type: array
      last_restore_response:
        description: |-
          LastRestoreResponse is the full gateway response JSON of the most
          recent restore attempt (the audit record). Only populated on the
          single-snapshot GET, not in lists.
        type: string
      last_restore_result:
        type: string
      last_restored_at:
        type: string
      name:
        type: string
      pinned:
        type: boolean
      restore_count:
        type: integer
      schema_version:
        type: string
      size_bytes:
        description: uncompressed JSON size
        type: integer
      stored_checksum:
        description: '"sha256:<hex>" over raw JSON bytes as received, OAM-computed'
        type: string
      trigger_type:
        type: string
    type: object
  models.InstanceSnapshotSchedule:
    properties:
      enabled:
        type: boolean
      instance_id:
        type: integer
      interval_hours:
        type: integer
      last_run_at:
        type: string
      last_run_result:
        type: string
      retain_count:
        type: integer
    type: object
  models.LogArchivesResponse:
    properties:
      archives:
        description: List of log archive filenames.
        items:
          type: string
        type: array
    type: object
  models.LogResponse:
    properties:
      logs:
        items:
          type: string
        type: array
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.LoxiLBInstance:
    properties:
      api_endpoint:
        type: string
      cimage:
        type: string
      created_at:
        type: string
      ctag:
        type: string
      description:
        type: string
      host:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      port:
        type: string
      protocol:
        type: string
      version:
        type: string
    type: object
  models.LoxiLBInstanceRequest:
    properties:
      cimage:
        type: string
      ctag:
        type: string
      description:
        type: string
      host:
        type: string
      is_active:
        description: Optional, defaults to true
        type: boolean
      name:
        type: string
      port:
        type: string
      protocol:
        description: '"http" or "https"'
        type: string
      version:
        type: string
    required:
    - cimage
    - ctag
    - host
    - name
    - port
    - protocol
    type: object
  models.MessageResponse:
    properties:
      message:
        type: string
    type: object
  models.PaginatedAlertsResponse:
    properties:
      data:
        description: The alert data
        items:
          $ref: '#/definitions/models.Alert'
        type: array
      pagination:
        allOf:
        - $ref: '#/definitions/models.PaginationMeta'
        description: Pagination metadata
    type: object
  models.PaginatedSnapshotsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.InstanceSnapshot'
        type: array
      pagination:
        $ref: '#/definitions/models.PaginationMeta'
    type: object
  models.PaginationMeta:
    properties:
      has_next:
        description: Whether there's a next page
        type: boolean
      has_prev:
        description: Whether there's a previous page
        type: boolean
      limit:
        description: Number of items per page
        type: integer
      page:
        description: Current page number
        type: integer
      total_count:
        description: Total number of items
        type: integer
      total_pages:
        description: Total number of pages
        type: integer
    type: object
  models.RestoreOutcome:
    properties:
      components:
        description: the selection sent to the gateway; absent = whole document
        items:
          type: string
        type: array
      cross_instance:
        type: boolean
      gateway_response:
        type: object
      gateway_retry_after:
        description: |-
          GatewayRetryAfter is the gateway's Retry-After header, when it sent
          one; the handler relays it as the response's own Retry-After.
        type: string
      gateway_status:
        type: integer
      instance_id:
        description: restore target
        type: integer
      mode:
        type: string
      pre_restore_snapshot_id:
        type: string
      snapshot_id:
        type: string
    type: object
  models.RestoreSnapshotRequest:
    properties:
      components:
        description: |-
          Components limits the restore to the named snapshot domains (for
          example ["auditsink"]). The gateway wipes and applies those domains
          only; it replaces their state, it does not merge. Absent restores
          everything the document covers. When present it must name at least
          one domain: an empty list is refused, never read as "everything".
        items:
          type: string
        type: array
      mode:
        description: '"dry-run" (default) | "commit"'
        type: string
      target_instance_id:
        description: |-
          TargetInstanceID restores the snapshot onto a different instance than
          the one it was taken from (cross-instance restore). Defaults to the
          snapshot's own instance.
        type: integer
    type: object
  models.SetupStatusResponse:
    properties:
      adminExists:
        type: boolean
      credentialsUpdated:
        type: boolean
      hasDefaultCredentials:
        type: boolean
      needsCredentialUpdate:
        type: boolean
      systemInfo:
        $ref: '#/definitions/models.SystemInfo'
    type: object
  models.SnapshotScheduleRequest:
    properties:
      enabled:
        type: boolean
      interval_hours:
        maximum: 8760
        minimum: 1
        type: integer
      retain_count:
        maximum: 1000
        minimum: 1
        type: integer
    type: object
  models.SuccessPostResponse:
    properties:
      code:
        description: code
        type: integer
      message:
        description: message
        type: string
    type: object
  models.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  models.SystemInfo:
    properties:
      adminUserId:
        type: integer
      installationId:
        type: string
      version:
        type: string
    type: object
  models.TakeSnapshotRequest:
    properties:
      description:
        type: string
      name:
        type: string
      trigger_type:
        description: defaults to "manual"
        type: string
    type: object
  models.UpdateFirmwareRequest:
    properties:
      cimage:
        example: ghcr.io/loxilb-io/loxilb
        type: string
      ctag:
        example: v0.9.8
        type: string
      description:
        description: Optional fields
        example: Updated firmware description
        type: string
      version:
        example: v0.9.8
        type: string
    required:
    - cimage
    - ctag
    type: object
  models.UpdateSnapshotRequest:
    properties:
      description:
        type: string
      name:
        type: string
      pinned:
        type: boolean
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        description: '"admin", "operator" or "viewer"'
        type: string
      username:
        type: string
    type: object
  models.UserIdResponse:
    properties:
      id:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Operations, Administration and Management API for LoxiLB instances —
    authentication, RBAC, user and instance management, configuration
    snapshots, and a management proxy.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: LoxiLB OAM API
paths:
  /oam/alerts:
    get:
      description: Retrieves all active alerts from the database with pagination (always
        returns paginated response)
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedAlertsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get active alerts
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Creates a new alert in the system
      parameters:
      - description: Alert data
        in: body
        name: alert
        required: true
        schema:
          $ref: '#/definitions/models.CreateAlertRequest'
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CreateAlertResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create alert
      tags:
      - alerts
  /oam/alerts/{id}/acknowledge:
    put:
      consumes:
      - application/json
      description: Acknowledges an alert by ID as the authenticated user. Body user_id
        must match the caller.
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: integer
      - description: Acknowledgement data
        in: body
        name: ackRequest
        required: true
        schema:
          $ref: '#/definitions/models.AcknowledgeRequest'
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AcknowledgeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Acknowledge alert
      tags:
      - alerts
  /oam/alerts/history:
    get:
      description: Retrieves alert history within a specified time range with pagination
        (always returns paginated response)
      parameters:
      - description: Start time (RFC3339 format)
        in: query
        name: start
        type: string
      - description: End time (RFC3339 format)
        in: query
        name: end
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedAlertsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get alert history
      tags:
      - alerts
  /oam/health:
    get:
      description: Checks the health of the application and database connection.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HealthCheckResponse'
      summary: Health check
      tags:
      - health
  /oam/instances/{id}/snapshot-schedule:
    get:
      description: Returns the scheduled-snapshot/retention settings; defaults (disabled,
        every 24h, keep 10) when never configured.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: LoxiLB Instance ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.InstanceSnapshotSchedule'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Read an instance's snapshot schedule
      tags:
      - snapshots
    put:
      consumes:
