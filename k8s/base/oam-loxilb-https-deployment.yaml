apiVersion: apps/v1
kind: Deployment
metadata:
  name: oam-loxilb-https
  namespace: oam-loxilb
  labels:
    app: oam-loxilb-https
    component: application
    protocol: https
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oam-loxilb-https
  template:
    metadata:
      labels:
        app: oam-loxilb-https
        component: application
        protocol: https
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for MySQL to be ready..."
            until nc -z mysql-service 3306; do
              echo "MySQL not ready yet. Waiting..."
              sleep 5
            done
            echo "MySQL is ready!"
      containers:
      - name: oam-loxilb-https
        image: oam-loxilb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 443
          name: https
        command:
        - ./loxilb-oam
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: oam-loxilb-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oam-loxilb-secret
              key: DB_PASSWORD
        - name: SERVER_PORT
          value: "443"
        envFrom:
        - configMapRef:
            name: oam-loxilb-ssl-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # livenessProbe:
        #   httpGet:
        #     path: /oam/health
        #     port: 443
        #     scheme: HTTPS
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        #   failureThreshold: 3
        # readinessProbe:
        #   httpGet:
        #     path: /oam/health
        #     port: 443
        #     scheme: HTTPS
        #   initialDelaySeconds: 15
        #   periodSeconds: 5
        #   timeoutSeconds: 3
        #   failureThreshold: 3
        volumeMounts:
        - name: oam-logs
          mountPath: /app/logs
        - name: ssl-certs
          mountPath: /app/ssl/server_certs
          readOnly: true
        args:
        - "-db-user=$(DB_USER)"
        - "-db-password=$(DB_PASSWORD)"
        - "-db-host=$(DB_HOST)"
        - "-db-port=$(DB_PORT)"
        - "-db-name=$(DB_NAME)"
        - "-token-expiration=$(TOKEN_EXPIRATION)"
        - "-port=$(SERVER_PORT)"
        - "--google-redirect-url=$(GOOGLE_REDIRECT_URL_HTTPS)"
        - "--github-redirect-url=$(GITHUB_REDIRECT_URL_HTTPS)"
        - "--facebook-redirect-url=$(FACEBOOK_REDIRECT_URL_HTTPS)"
        - "--enable-https=true"
        - "--ssl-cert-file=$(SSL_CERT_FILE)"
        - "--ssl-key-file=$(SSL_KEY_FILE)"
      volumes:
      - name: oam-logs
        emptyDir: {}
      - name: ssl-certs
        secret:
          secretName: ssl-certs
          items:
          - key: server.crt
            path: server.crt
          - key: server.key
            path: server.key