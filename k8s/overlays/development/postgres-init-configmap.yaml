# GENERATED FILE — do not edit by hand.
# Regenerate with: make k8s-init-configmap
# The schema is single-sourced from database/init/00-init-complete.sql; the four
# hand-maintained copies this replaces had drifted badly (the production one had
# lost the system_config table the service requires).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: oam-loxilb
  labels:
    app: postgres
    component: database-init
data:
  00-init-complete.sql: |
    -- Complete database initialization for PostgreSQL (runs automatically on first startup).
    -- Mounted at /docker-entrypoint-initdb.d, so it executes against POSTGRES_DB as
    -- POSTGRES_USER — the account the OAM service itself connects with, which is
    -- why there are no explicit GRANTs here: the connecting role owns every object.
    --
    -- There is no `USE <db>` equivalent in PostgreSQL; the connection selects the
    -- database. Every statement below is idempotent so the file is safe to re-run
    -- by hand against an existing database (`psql -f`).

    -- ---------------------------------------------------------------------------
    -- Shared trigger: emulate MySQL's `ON UPDATE CURRENT_TIMESTAMP`.
    -- PostgreSQL has no column-level equivalent, so tables that need a
    -- self-maintaining updated_at attach this trigger explicitly.
    -- ---------------------------------------------------------------------------
    CREATE OR REPLACE FUNCTION set_updated_at() RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- Users table (role column drives RBAC)
    CREATE TABLE IF NOT EXISTS users (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        username VARCHAR(255) NOT NULL UNIQUE,
        password VARCHAR(255) NOT NULL,
        -- RBAC Phase 2 3-role model; 'user' kept as a legacy alias of operator.
        -- MySQL's ENUM is expressed as a CHECK constraint: the Go layer reads and
        -- writes these as plain strings, so a native enum type would buy nothing
        -- and would make adding a role a type migration rather than a constraint one.
        role VARCHAR(16) DEFAULT 'viewer' CHECK (role IN ('admin', 'operator', 'viewer', 'user')),
        email VARCHAR(255) DEFAULT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        credentials_updated BOOLEAN DEFAULT FALSE,
        credentials_updated_at TIMESTAMP NULL,
        must_change_password BOOLEAN DEFAULT FALSE
    );

    COMMENT ON COLUMN users.credentials_updated IS 'True if user has updated from default credentials';
    COMMENT ON COLUMN users.credentials_updated_at IS 'When credentials were last updated';
    COMMENT ON COLUMN users.must_change_password IS 'True if user must change password on next login';

    -- LoxiLB instances table
    CREATE TABLE IF NOT EXISTS loxilb_instances (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        host VARCHAR(255) NOT NULL,
        port VARCHAR(255) NOT NULL,
        protocol VARCHAR(10) NOT NULL DEFAULT 'https',
        description TEXT,
        version VARCHAR(255) NOT NULL,
        api_endpoint VARCHAR(255) NOT NULL UNIQUE,
        cimage VARCHAR(255) NOT NULL,
        ctag VARCHAR(255) NOT NULL,
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- API tokens table.
    -- MySQL indexed only the first 255 bytes of this TEXT column because it cannot
    -- index TEXT outright; PostgreSQL indexes the whole value, so the uniqueness
    -- constraint is exact here rather than prefix-approximate.
    CREATE TABLE IF NOT EXISTS api_tokens (
        token_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        token_value TEXT NOT NULL,
        user_id VARCHAR(255) NOT NULL,
        scopes TEXT,
        expires_at TIMESTAMP NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT uk_token_value UNIQUE (token_value)
    );

    -- Logs table.
    -- "timestamp" is quoted throughout: it is a type name in PostgreSQL, and while
    -- the parser accepts it as a column name, quoting removes all ambiguity.
    CREATE TABLE IF NOT EXISTS logs (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        level VARCHAR(10),
        "timestamp" TIMESTAMP,
        severity VARCHAR(45),
        facility VARCHAR(45),
        programname VARCHAR(45),
        host VARCHAR(255),
        message TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Alerts table
    CREATE TABLE IF NOT EXISTS alerts (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        instance_id INTEGER NOT NULL,
        type VARCHAR(32) NOT NULL
            CHECK (type IN ('DB_DISCONNECT', 'API_UNREACHABLE', 'HIGH_CPU', 'MEMORY_LEAK')),
        severity VARCHAR(16) NOT NULL
            CHECK (severity IN ('INFO', 'WARNING', 'CRITICAL')),
        message TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        resolved_at TIMESTAMP NULL DEFAULT NULL,
        CONSTRAINT fk_alert_instance FOREIGN KEY (instance_id)
            REFERENCES loxilb_instances(id) ON DELETE CASCADE
    );

    -- Acknowledgment table
    CREATE TABLE IF NOT EXISTS acknowledgments (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        alert_id INTEGER NOT NULL,
        user_id INTEGER NOT NULL,
        ack_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT fk_ack_alert FOREIGN KEY (alert_id) REFERENCES alerts(id) ON DELETE CASCADE,
        CONSTRAINT fk_ack_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    );

    -- System settings table for persistent configuration
    CREATE TABLE IF NOT EXISTS system_settings (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        setting_key VARCHAR(100) NOT NULL UNIQUE,
        setting_value TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    DROP TRIGGER IF EXISTS trg_system_settings_updated_at ON system_settings;
    CREATE TRIGGER trg_system_settings_updated_at
        BEFORE UPDATE ON system_settings
        FOR EACH ROW EXECUTE FUNCTION set_updated_at();

    -- System-wide configuration table (global configuration tracking)
    CREATE TABLE IF NOT EXISTS system_config (
        config_key VARCHAR(50) PRIMARY KEY,
        config_value TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    COMMENT ON TABLE  system_config IS 'System-wide configuration storage';
    COMMENT ON COLUMN system_config.config_key IS 'Configuration key identifier';
    COMMENT ON COLUMN system_config.config_value IS 'Configuration value (JSON or string)';
    COMMENT ON COLUMN system_config.created_at IS 'When configuration was created';
    COMMENT ON COLUMN system_config.updated_at IS 'When configuration was last updated';

    DROP TRIGGER IF EXISTS trg_system_config_updated_at ON system_config;
    CREATE TRIGGER trg_system_config_updated_at
        BEFORE UPDATE ON system_config
        FOR EACH ROW EXECUTE FUNCTION set_updated_at();

    -- Login attempts table for tracking failed login attempts and lockouts.
    -- Prevents brute force attacks by blocking access after repeated failures.
    CREATE TABLE IF NOT EXISTS login_attempts (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        username VARCHAR(255) NOT NULL,
        client_ip VARCHAR(64) NOT NULL,
        failed_count INTEGER NOT NULL DEFAULT 0,
        last_failed_at TIMESTAMP NOT NULL,
        blocked_until TIMESTAMP NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT uniq_username_ip UNIQUE (username, client_ip)
    );

    DROP TRIGGER IF EXISTS trg_login_attempts_updated_at ON login_attempts;
    CREATE TRIGGER trg_login_attempts_updated_at
        BEFORE UPDATE ON login_attempts
        FOR EACH ROW EXECUTE FUNCTION set_updated_at();

    -- Instance snapshot orchestration.
    -- Blobs live IN the database — container-local files are what broke the
    -- legacy config-export feature.
    CREATE TABLE IF NOT EXISTS instance_snapshots (
        id                VARCHAR(36) PRIMARY KEY,
        instance_id       INTEGER NOT NULL,
        name              VARCHAR(128) NOT NULL,
        description       TEXT,
        trigger_type      VARCHAR(16) NOT NULL
            CHECK (trigger_type IN ('manual', 'scheduled', 'pre_restore', 'pre_upgrade')),
        schema_version    VARCHAR(16) NOT NULL,
        gateway_version   VARCHAR(64) NOT NULL,
        -- MySQL stored this as INT UNSIGNED. PostgreSQL has no unsigned integers,
        -- so the range is carried by BIGINT plus an explicit non-negative CHECK.
        size_bytes        BIGINT NOT NULL CHECK (size_bytes >= 0),
        checksum          VARCHAR(71) NOT NULL,
        stored_checksum   VARCHAR(71) NOT NULL,
        snapshot_blob     BYTEA NOT NULL,
        encrypted         BOOLEAN NOT NULL DEFAULT FALSE,
        pinned            BOOLEAN NOT NULL DEFAULT FALSE,
        checksum_ok       BOOLEAN NOT NULL DEFAULT TRUE,
        created_by        VARCHAR(64) NOT NULL,
        created_at        TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        restore_count     INTEGER NOT NULL DEFAULT 0 CHECK (restore_count >= 0),
        last_restored_at  TIMESTAMP NULL,
        last_restore_result VARCHAR(16) NULL
            CHECK (last_restore_result IS NULL
                   OR last_restore_result IN ('ok', 'rolled_back', 'rollback_failed')),
        last_restore_response TEXT NULL,
        CONSTRAINT fk_snap_instance FOREIGN KEY (instance_id)
            REFERENCES loxilb_instances(id) ON DELETE CASCADE
    );

    COMMENT ON COLUMN instance_snapshots.checksum IS '"sha256:<hex>", gateway-computed (envelope)';
    COMMENT ON COLUMN instance_snapshots.stored_checksum IS '"sha256:<hex>" over the raw JSON bytes as received, OAM-computed';
    COMMENT ON COLUMN instance_snapshots.snapshot_blob IS 'gzip(JSON), AES-256-GCM when encrypted';
    COMMENT ON COLUMN instance_snapshots.last_restore_response IS 'Full gateway restore response JSON (audit)';

    CREATE TABLE IF NOT EXISTS instance_snapshot_schedules (
        instance_id       INTEGER PRIMARY KEY,
        enabled           BOOLEAN NOT NULL DEFAULT FALSE,
        interval_hours    INTEGER NOT NULL DEFAULT 24 CHECK (interval_hours > 0),
        retain_count      INTEGER NOT NULL DEFAULT 10 CHECK (retain_count > 0),
        last_run_at       TIMESTAMP NULL,
        last_run_result   VARCHAR(255) NULL,
        CONSTRAINT fk_sched_instance FOREIGN KEY (instance_id)
            REFERENCES loxilb_instances(id) ON DELETE CASCADE
    );

    -- ---------------------------------------------------------------------------
    -- Indexes.
    -- MySQL needed a stored procedure to emulate "create index if not present";
    -- PostgreSQL supports IF NOT EXISTS directly, so the procedure is gone.
    -- ---------------------------------------------------------------------------
    CREATE INDEX IF NOT EXISTS idx_users_username ON users (username);
    CREATE INDEX IF NOT EXISTS idx_users_credentials_updated ON users (credentials_updated);
    CREATE INDEX IF NOT EXISTS idx_users_username_credentials ON users (username, credentials_updated);
    CREATE INDEX IF NOT EXISTS idx_loxilb_instances_api_endpoint ON loxilb_instances (api_endpoint);
    CREATE INDEX IF NOT EXISTS idx_api_tokens_user_id ON api_tokens (user_id);
    CREATE INDEX IF NOT EXISTS idx_api_tokens_expires_at ON api_tokens (expires_at);
    CREATE INDEX IF NOT EXISTS idx_logs_timestamp ON logs ("timestamp");
    CREATE INDEX IF NOT EXISTS idx_logs_level ON logs (level);
    CREATE INDEX IF NOT EXISTS idx_alerts_instance_id ON alerts (instance_id);
    CREATE INDEX IF NOT EXISTS idx_alerts_created_at ON alerts (created_at);
    CREATE INDEX IF NOT EXISTS idx_acknowledgments_alert_id ON acknowledgments (alert_id);
    CREATE INDEX IF NOT EXISTS idx_login_attempts_blocked_until ON login_attempts (blocked_until);
    CREATE INDEX IF NOT EXISTS idx_login_attempts_username ON login_attempts (username);
    CREATE INDEX IF NOT EXISTS idx_login_attempts_last_failed_at ON login_attempts (last_failed_at);
    CREATE INDEX IF NOT EXISTS idx_snap_instance ON instance_snapshots (instance_id, created_at DESC);

    -- ---------------------------------------------------------------------------
    -- Seed data.
    -- MySQL's `ON DUPLICATE KEY UPDATE col = col` was a no-op upsert used purely to
    -- make re-runs safe; PostgreSQL says that directly with DO NOTHING.
    -- ---------------------------------------------------------------------------

    -- Seed initial configuration values for admin credential tracking
    INSERT INTO system_config (config_key, config_value) VALUES
        ('admin_credentials_updated', 'false'),
        ('admin_setup_version', '1.0')
    ON CONFLICT (config_key) DO NOTHING;

    -- Initialize system first boot timestamp
    INSERT INTO system_settings (setting_key, setting_value)
    VALUES ('first_boot_at', NOW()::text)
    ON CONFLICT (setting_key) DO NOTHING;

    -- No instances are seeded. A placeholder row pointing at a host that does not
    -- exist ('loxilb-enterprise:11111') shipped here previously: every fresh
    -- deployment inherited an instance permanently stuck in Down, which an operator
    -- has to recognise as fake and delete by hand. Instances are registered by the
    -- operator (console / POST /oam/loxilbs), or automatically by
    -- deploy/compose/scripts/init-converged.sh for a co-located gateway.
