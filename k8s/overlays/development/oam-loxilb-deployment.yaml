apiVersion: apps/v1
kind: Deployment
metadata:
  name: oam-loxilb
  namespace: oam-loxilb
  labels:
    app: oam-loxilb
    component: application
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oam-loxilb
  template:
    metadata:
      labels:
        app: oam-loxilb
        component: application
        environment: development
    spec:
      containers:
      - name: oam-loxilb
        image: oam-loxilb:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 443
          name: https
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: DB_NAME
        - name: TOKEN_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: TOKEN_EXPIRATION
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: SERVER_PORT
        - name: ENABLE_HTTPS
          value: "true"
        - name: SSL_CERT_FILE
          value: "/app/ssl/server_certs/server.crt"
        - name: SSL_KEY_FILE
          value: "/app/ssl/server_certs/server.key"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: ssl-certs
          mountPath: /app/ssl/server_certs
          readOnly: true
        command: ["./loxilb-oam"]
        args: 
        - "-db-user=$(DB_USER)"
        - "-db-password=$(DB_PASSWORD)" 
        - "-db-host=$(DB_HOST)"
        - "-db-port=$(DB_PORT)"
        - "-db-name=$(DB_NAME)"
        - "-token-expiration=$(TOKEN_EXPIRATION)"
        - "-port=$(SERVER_PORT)"
        - "--enable-https=true"
        - "--ssl-cert-file=$(SSL_CERT_FILE)"
        - "--ssl-key-file=$(SSL_KEY_FILE)"
        livenessProbe:
          httpGet:
            path: /oam/health
            port: 443
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /oam/health
            port: 443
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: ssl-certs
        secret:
          secretName: ssl-certs
          items:
          - key: server.crt
            path: server.crt
          - key: server.key
            path: server.key
          - key: ca.crt
            path: ca.crt
      restartPolicy: Always