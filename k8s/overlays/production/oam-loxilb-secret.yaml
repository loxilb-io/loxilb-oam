# Replace CHANGE_ME with a real secret before applying (do not commit real secrets).
apiVersion: v1
kind: Secret
metadata:
  name: oam-loxilb-secret
  namespace: oam-loxilb
type: Opaque
stringData:
  DB_USER: oamuser
  DB_PASSWORD: CHANGE_ME
  # Snapshot at-rest encryption.
  # Generate with: openssl rand -base64 32
  # Leaving it empty stores snapshots plaintext-gzip and logs a startup warning.
  SNAPSHOT_ENC_KEY: ""
