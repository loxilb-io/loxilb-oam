apiVersion: apps/v1
kind: Deployment
metadata:
  name: oam-loxilb
  namespace: oam-loxilb
  labels:
    app: oam-loxilb
    component: application
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oam-loxilb
  template:
    metadata:
      labels:
        app: oam-loxilb
        component: application
        environment: production
    spec:
      containers:
      - name: oam-loxilb
        image: oam-loxilb:v0.9.8.7
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 443
          name: https
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-database
        - name: TOKEN_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: token-expiration
        # Snapshot at-rest encryption key (base64 32 bytes, design §6).
        # Snapshots carry IPsec PSKs / cert private keys — keep this set.
        - name: SNAPSHOT_ENC_KEY
          valueFrom:
            secretKeyRef:
              name: oam-loxilb-secret
              key: SNAPSHOT_ENC_KEY
              optional: true
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: oam-loxilb-config
              key: server-port
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /oam/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /oam/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always