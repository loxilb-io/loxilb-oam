apiVersion: v1
kind: Service
metadata:
  name: oam-loxilb-service
  namespace: oam-loxilb
  labels:
    app: oam-loxilb
    component: application
    environment: production
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: oam-loxilb