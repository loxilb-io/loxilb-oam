apiVersion: apps/v1
kind: Deployment
metadata:
  name: oam-loxilb
  namespace: oam-loxilb
  labels:
    app: oam-loxilb
    component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oam-loxilb
  template:
    metadata:
      labels:
        app: oam-loxilb
        component: application
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for MySQL to be ready..."
            until nc -z mysql-service 3306; do
              echo "MySQL not ready yet. Waiting..."
              sleep 5
            done
            echo "MySQL is ready!"
      containers:
      - name: oam-loxilb
        image: oam-loxilb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        command:
        - ./loxilb-oam
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: oam-loxilb-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oam-loxilb-secret
              key: DB_PASSWORD
        envFrom:
        - configMapRef:
            name: oam-loxilb-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # livenessProbe:
        #   httpGet:
        #     path: /oam/health
        #     port: 8080
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        #   failureThreshold: 3
        # readinessProbe:
        #   httpGet:
        #     path: /oam/health
        #     port: 8080
        #   initialDelaySeconds: 15
        #   periodSeconds: 5
        #   timeoutSeconds: 3
        #   failureThreshold: 3
        volumeMounts:
        - name: oam-logs
          mountPath: /app/logs
        args:
        - "-db-user=$(DB_USER)"
        - "-db-password=$(DB_PASSWORD)"
        - "-db-host=$(DB_HOST)"
        - "-db-port=$(DB_PORT)"
        - "-db-name=$(DB_NAME)"
        - "-token-expiration=$(TOKEN_EXPIRATION)"
        - "-port=$(SERVER_PORT)"
        - "--google-redirect-url=$(GOOGLE_REDIRECT_URL_HTTPS)"
        - "--github-redirect-url=$(GITHUB_REDIRECT_URL_HTTPS)"
        - "--facebook-redirect-url=$(FACEBOOK_REDIRECT_URL_HTTPS)"
        - "--enable-https=false"
      volumes:
      - name: oam-logs
        emptyDir: {}