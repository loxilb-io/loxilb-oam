# Replace CHANGE_ME with a real secret before applying (do not commit real secrets).
# PostgreSQL has no separate superuser password here: postgres-user owns
# postgres-database, so the MySQL stack's mysql-root-password has no equivalent.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: oam-loxilb
type: Opaque
stringData:
  postgres-user: oamuser
  postgres-password: CHANGE_ME
  postgres-database: loxioam
