# loxilb-oam — API-only stack: PostgreSQL + the OAM service over plain HTTP.
#
#   1. cp .env.example .env   and set the required secrets
#   2. docker compose up -d
#
#   DB only : docker compose up -d postgres   (e.g. when running the binary from
#             source — see docs/database-installation.md)
#
# This stack serves HTTP and does NOT include the web console. For a production
# deployment — UI + API + PostgreSQL behind a Caddy TLS edge — use the bundle in
# deploy/compose/ (guide: docs/deployment-compose.md).

services:
  postgres:
    image: postgres:18.6
    container_name: oam-loxilb-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-loxioam}
      # Single-sourced from DB_PASSWORD (same key the bundle uses) — provisions
      # the oamuser account, which owns the database and is what OAM connects
      # with. PostgreSQL has no separate root account to password here.
      POSTGRES_USER: ${DB_USER:-oamuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker and declares
      # its volume one level up; mounting the pre-18 .../data path would not
      # persist anything.
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d
    # Tuning is passed as flags rather than a mounted postgresql.conf: pointing
    # config_file at a file outside PGDATA also moves where PostgreSQL looks for
    # pg_hba.conf (it defaults to the config file's own directory), which breaks
    # authentication unless every path is repeated. These few settings are the
    # MySQL my.cnf equivalents that actually mattered.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=UTC
      # Log statements slower than 2s — the analogue of MySQL's
      # slow_query_log + long_query_time=2. The old my.cnf also set
      # general_log=1 (log every statement); that is deliberately not carried
      # over, because the equivalent (log_statement=all) writes credentials and
      # token values into the log. Add it explicitly if you need it.
      - -c
      - log_min_duration_statement=2000
    networks:
      - oam-loxilb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped

  oam-loxilb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Release identifier compiled into the binary (`loxilb-oam -version`).
        # A source build is "dev" unless OAM_VERSION is set — set it to the
        # release this tree corresponds to (e.g. OAM_VERSION=v0.9.8.7) when
        # building an image you intend to keep.
        VERSION: ${OAM_VERSION:-dev}
    image: loxilb-oam:latest
    container_name: oam-loxilb-app
    environment:
      # Required secrets (the server refuses to start without them).
      OAM_JWT_SECRET: ${OAM_JWT_SECRET:?set in .env}
      OAM_DEFAULT_ADMIN_PASSWORD: ${OAM_DEFAULT_ADMIN_PASSWORD:?set in .env}
      # Database connection.
      DB_USER: ${DB_USER:-oamuser}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-loxioam}
      SERVER_PORT: 8080
      TOKEN_EXPIRATION: ${TOKEN_EXPIRATION:-480}
      # Snapshot at-rest encryption: base64-encoded 32-byte AES-256 key
      # (openssl rand -base64 32). Snapshots carry IPsec PSKs and cert private
      # keys — production MUST set this. Unset => snapshots stored unencrypted.
      SNAPSHOT_ENC_KEY: ${SNAPSHOT_ENC_KEY:-}
      # CORS allowlist (comma-separated). Unset => wildcard (development only).
      OAM_ALLOWED_ORIGINS: ${OAM_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oam-loxilb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/oam/health"]
      timeout: 10s
      retries: 3
      interval: 30s
      start_period: 30s
    restart: unless-stopped
    volumes:
      # The service logs to /var/log/loxioam.log, and the log-retrieval API
      # lists /var/log — persist that directory, not /app/logs (which nothing
      # writes to). Docker seeds the empty volume from the image's /var/log on
      # first run, so the directory the image prepares is preserved.
      - oam_logs:/var/log

networks:
  oam-loxilb-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  oam_logs:
    driver: local
