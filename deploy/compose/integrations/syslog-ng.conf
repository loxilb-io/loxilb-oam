@version: 4.8
@include "scl.conf"
options { keep-hostname(yes); chain-hostnames(no); flush-lines(1); log-msg-size(1048576); };
source s_gateway {
    syslog(ip("0.0.0.0") port(6514) transport("tls") flags(store-raw-message)
        tls(cert-file("/run/tls/server.crt") key-file("/run/tls/server.key")
            peer-verify(optional-untrusted) ssl-options(no-tlsv1, no-tlsv11)));
};
# Raw RFC5424 text (without octet-count framing), including the original JSON
# MSG. Compare its record identity/hash to the Gateway's authoritative JSONL.
destination d_receipts {
    file("/var/log/siem/receipts-${YEAR}${MONTH}${DAY}.log"
        template("${RAWMSG}\n") flags(no-multi-line) perm(0600) create-dirs(yes));
};
log { source(s_gateway); destination(d_receipts); flags(flow-control); };
