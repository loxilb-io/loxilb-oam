# Converged shared state — one PostgreSQL server and one logical database for
# loxilb-oam plus the Gateway's isolated aigw/aigw_mgmt schemas.
#
# This is a separate project so management-plane or data-plane maintenance does
# not implicitly stop the shared database:
#   docker compose -f docker-compose.database.yml up -d
name: loxilb-state

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    environment:
      POSTGRES_DB: ${DB_NAME:-loxioam}
      POSTGRES_USER: ${DB_USER:-oamuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ${DB_INIT_DIR:-../../database/init}:/docker-entrypoint-initdb.d:ro
    ports:
      # The host-network Gateway reaches this listener. It is never exposed on
      # a routable address; OAM uses the private shared network below.
      - "127.0.0.1:${CONVERGED_PG_HOST_PORT:-5432}:5432"
    networks:
      database:
        aliases: [postgres]
      # Docker Engine does not activate published ports for a container that is
      # attached only to an `internal` network. This state-project-only bridge
      # supplies the host NAT path; the port remains bound to 127.0.0.1, and
      # OAM still uses the separate internal database network above.
      host_access: {}
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  gateway-db-bootstrap:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER:-oamuser}
      PGDATABASE: ${DB_NAME:-loxioam}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    secrets:
      - aigw_db_password
      - aigw_mgmt_db_password
    volumes:
      - ./database/aigw-db-bootstrap.sql:/bootstrap/aigw-db-bootstrap.sql:ro
    command:
      - sh
      - -ec
      - |
        export AIGW_DB_PASSWORD="$$(cat /run/secrets/aigw_db_password)"
        export AIGW_MGMT_DB_PASSWORD="$$(cat /run/secrets/aigw_mgmt_db_password)"
        psql -q -v ON_ERROR_STOP=1 -f /bootstrap/aigw-db-bootstrap.sql
        psql -qAt -v ON_ERROR_STOP=1 -c "SELECT nspname FROM pg_namespace WHERE nspname IN ('aigw','aigw_mgmt') ORDER BY 1"
    networks: [database]
    restart: "no"

networks:
  database:
    name: ${CONVERGED_DB_NETWORK:-loxilb-converged-db}
    internal: true
  host_access:

volumes:
  postgres_data:
    name: ${CONVERGED_PG_VOLUME:-loxilb-state-postgres-data}

secrets:
  aigw_db_password:
    file: ${AIGW_DB_PASSWORD_FILE:-./secrets/aigw_db_password}
  aigw_mgmt_db_password:
    file: ${AIGW_MGMT_DB_PASSWORD_FILE:-./secrets/aigw_mgmt_db_password}
