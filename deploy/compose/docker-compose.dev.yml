# Development overlay — build the OAM image from local source, publish debug
# ports, and default to insecure instance TLS.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The OAM build context is this repository (../..); override OAM_SRC in .env if
# your layout differs. The web console is NOT built here — loxilb-ui is its own
# repository and ships its own image, so ui-assets keeps the base file's
# ${UI_IMAGE}:${UI_TAG} reference. To run a UI you built yourself, point
# UI_IMAGE / UI_TAG at that image in .env.
services:
  mysql:
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"   # exposed for local DB inspection

  oam-loxilb:
    build:
      context: ${OAM_SRC:-../..}
      dockerfile: Dockerfile
      args:
        # Release identifier compiled into the binary (`loxilb-oam -version`).
        # A source build reports "dev" unless OAM_VERSION names the release the
        # tree corresponds to (e.g. OAM_VERSION=v0.9.8.7).
        VERSION: ${OAM_VERSION:-dev}
    image: loxilb-oam:dev
    ports:
      - "${OAM_HOST_PORT:-8080}:8080"     # exposed for direct API/Swagger access
    environment:
      # Dev default: skip instance-cert verification. Never do this in prod.
      OAM_INSTANCE_TLS_INSECURE: ${OAM_INSTANCE_TLS_INSECURE:-true}
