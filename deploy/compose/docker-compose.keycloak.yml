# Optional identity provider. Never merge into the management/data project.
name: loxilb-keycloak
services:
  postgres:
    image: ${KEYCLOAK_POSTGRES_IMAGE:-postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - keycloak_db:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741}
    restart: unless-stopped
    entrypoint: [/bin/bash, -ec]
    command:
      - 'export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/admin_password)"; exec /opt/keycloak/bin/kc.sh start'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-bootstrap-admin}
    secrets: [admin_password]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${KEYCLOAK_BIND_IP:-127.0.0.1}:${KEYCLOAK_HTTPS_PORT:-18443}:8443'
    volumes:
      - type: bind
        source: ./integrations/private/keycloak.conf
        target: /opt/keycloak/conf/keycloak.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./integrations/private/keycloak.crt
        target: /opt/keycloak/conf/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./integrations/private/keycloak.key
        target: /opt/keycloak/conf/server.key
        read_only: true
        bind: {create_host_path: false}
    networks: [database, egress]
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  database: {internal: true}
  egress: {}
volumes:
  keycloak_db:
    external: true
    name: ${KEYCLOAK_DB_VOLUME:-loxilb-keycloak-db}
secrets:
  db_password:
    file: ./integrations/private/db_password
  admin_password:
    file: ./integrations/private/admin_password
