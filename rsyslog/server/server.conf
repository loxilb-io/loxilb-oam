input(type="imudp" port="514")  # Listen on UDP port 514
set $.loglevel = re_extract($msg, "^([A-Z]+):", 0, 0, "NONE");

# option.stdsql (not option.sql) is the correct escaping mode for PostgreSQL;
# option.sql applies MySQL's backslash-escaping rules, which PostgreSQL rejects
# under its default standard_conforming_strings.
#
# `timestamp` is left unquoted: PostgreSQL accepts it as a column name in an
# INSERT column list, and the template's own delimiter is a double quote.
template(name="PgSQLTemplate" type="string" option.stdsql="on" string="INSERT INTO logs (level, timestamp, severity, facility, programname, host, message) VALUES ('%$.loglevel%', '%timegenerated:::date-pgsql%', '%syslogseverity-text%', '%syslogfacility-text%', '%programname%', '%fromhost-ip%', '%msg%');")

# Write the extracted data to PostgreSQL. Requires the rsyslog-pgsql module
# (Debian/Ubuntu: `apt install rsyslog-pgsql`), which replaces rsyslog-mysql.
module(load="ompgsql")

action(type="ompgsql"
       server="127.0.0.1"
       port="5432"
       db="loxioam"
       uid="oamuser"
       pwd="CHANGE_ME"
       template="PgSQLTemplate")
